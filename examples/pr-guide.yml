# Copy to .github/workflows/pr-guide.yml in the repo you want guides for.
name: PR guide

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

# One guide per PR at a time; a new push cancels the run for the old commit.
concurrency:
  group: pr-guide-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  guide:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: YOUR-GITHUB-USER/pr-guide@v1
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
